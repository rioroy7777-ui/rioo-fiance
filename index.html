        '<div class="calc-row"><span class="calc-op">×</span><input type="number" id="ci_perWeek" min="0" value="' + defaults.perWeek + '" inputmode="numeric"><label>times per week</label></div>' +
        '<div class="calc-row"><span class="calc-op">×</span><input type="number" id="ci_weeks" min="0" value="' + defaults.weeks + '" inputmode="numeric"><label>weeks per month</label></div>' +
        '<div class="calc-row" style="margin-top:.35rem"><label style="font-size:.75rem;color:var(--muted)">E.g. physiotherapy ₹300 × 4 times/week × 4 weeks</label></div>';
      if(mode === 'perweek') return '<div class="calc-row"><input type="number" id="ci_weekly" min="0" value="' + (defaults.amount||'') + '" inputmode="numeric"><label>₹ per week</label></div>' +
        '<div class="calc-row"><span class="calc-op">×</span><input type="number" id="ci_weeks2" min="0" value="' + defaults.weeks + '" inputmode="numeric"><label>weeks per month</label></div>';
      if(mode === 'perday') return '<div class="calc-row"><input type="number" id="ci_daily" min="0" value="' + (defaults.amount||'') + '" inputmode="numeric"><label>₹ per day</label></div>' +
        '<div class="calc-row"><span class="calc-op">×</span><input type="number" id="ci_days" min="0" value="' + defaults.days + '" inputmode="numeric"><label>days per month</label></div>';
      return '';
    }
    function computeTotal(mode, box){
      function val(id){ var el = box.querySelector('#' + id); return el ? Number(el.value || 0) : 0; }
      if(mode === 'monthly') return val('ci_amount');
      if(mode === 'peruse') return val('ci_unit') * val('ci_perWeek') * val('ci_weeks');
      if(mode === 'perweek') return val('ci_weekly') * val('ci_weeks2');
      if(mode === 'perday') return val('ci_daily') * val('ci_days');
      return 0;
    }
    var currentMode = defaults.mode;
    var currentEmoji = defaults.emoji;
    var currentColor = defaults.color;
    openModal({
      title: isEdit ? 'Edit chip' : 'New chip',
      sub: isEdit ? 'Update this chip' : 'Build a custom monthly cost',
      body:
        '<div class="form-group"><label class="form-label">Chip name</label>' +
        '<input class="form-input" id="chipName" value="' + MO.escapeHTML(defaults.name) + '" placeholder="e.g. Physiotherapy" autofocus></div>' +
        '<div class="form-group"><label class="form-label">Emoji</label>' +
        '<div class="picker-row" id="emojiPicker">' +
        ORCH_EMOJIS.map(function(e){ return '<button type="button" class="emoji-btn ' + (e===currentEmoji?'active':'') + '" data-emoji="' + e + '">' + e + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="form-group"><label class="form-label">Colour</label>' +
        '<div class="picker-row" id="colorPicker">' +
        ORCH_COLORS.map(function(c){ return '<button type="button" class="color-btn ' + (c===currentColor?'active':'') + '" data-color="' + c + '" style="background:' + c + '"></button>'; }).join('') +
        '</div></div>' +
        '<div class="form-group"><label class="form-label">How is it calculated?</label>' +
        '<div class="seg" id="chipMode">' +
        MODES.map(function(m){ return '<button type="button" data-mode="' + m.id + '" class="' + (m.id===currentMode?'active':'') + '">' + m.label + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="calc-card"><div id="calcBody">' + calcBody(currentMode) + '</div>' +
        '<div class="calc-result"><div class="calc-result-label">Monthly total</div><div class="calc-result-value" id="calcResultValue">₹0</div></div></div>',
      footer:
        (isEdit ? '<button class="btn btn-ghost" id="chipDel" style="color:var(--red)"><i class="fas fa-trash"></i></button>' : '') +
        '<button class="btn btn-ghost btn-block" data-close>Cancel</button>' +
        '<button class="btn btn-lime btn-block" id="chipSave">' + (isEdit ? 'Save' : 'Add chip') + '</button>',
      onMount: function(box){
        var resultEl = box.querySelector('#calcResultValue');
        function updateResult(){ var total = Math.round(computeTotal(currentMode, box)); resultEl.textContent = '₹' + total.toLocaleString('en-IN'); }
        function bindInputs(){ Array.prototype.forEach.call(box.querySelectorAll('#calcBody input'), function(inp){ inp.addEventListener('input', updateResult); }); }
        bindInputs(); updateResult();
        Array.prototype.forEach.call(box.querySelectorAll('#chipMode button'), function(btn){
          btn.onclick = function(){
            Array.prototype.forEach.call(box.querySelectorAll('#chipMode button'), function(b){ b.classList.remove('active'); });
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            box.querySelector('#calcBody').innerHTML = calcBody(currentMode);
            bindInputs(); updateResult();
          };
        });
        Array.prototype.forEach.call(box.querySelectorAll('#emojiPicker .emoji-btn'), function(b){
          b.onclick = function(){
            Array.prototype.forEach.call(box.querySelectorAll('#emojiPicker .emoji-btn'), function(x){ x.classList.remove('active'); });
            b.classList.add('active'); currentEmoji = b.dataset.emoji;
          };
        });
        Array.prototype.forEach.call(box.querySelectorAll('#colorPicker .color-btn'), function(b){
          b.onclick = function(){
            Array.prototype.forEach.call(box.querySelectorAll('#colorPicker .color-btn'), function(x){ x.classList.remove('active'); });
            b.classList.add('active'); currentColor = b.dataset.color;
          };
        });
        box.querySelector('#chipSave').onclick = function(){
          var name = box.querySelector('#chipName').value.trim();
          if(!name){ toast('Give your chip a name', 'fa-triangle-exclamation'); return; }
          var total = Math.round(computeTotal(currentMode, box));
          if(total <= 0){ toast('Amount must be more than 0', 'fa-triangle-exclamation'); return; }
          var calc = { mode: currentMode };
          function val(id){ var el = box.querySelector('#' + id); return el ? Number(el.value || 0) : 0; }
          if(currentMode === 'monthly') calc.amount = val('ci_amount');
          if(currentMode === 'peruse'){ calc.unit = val('ci_unit'); calc.perWeek = val('ci_perWeek'); calc.weeks = val('ci_weeks'); }
          if(currentMode === 'perweek'){ calc.amount = val('ci_weekly'); calc.weeks = val('ci_weeks2'); }
          if(currentMode === 'perday'){ calc.amount = val('ci_daily'); calc.days = val('ci_days'); }
          var payload = { name: name, amount: total, emoji: currentEmoji, color: currentColor, calc: calc };
          if(!Array.isArray(state.orchestrate.chips)) state.orchestrate.chips = [];
          if(isEdit) Object.assign(existing, payload);
          else state.orchestrate.chips.push(Object.assign({ id: MO.uid() }, payload));
          saveState(); closeModal(); toast(isEdit ? 'Chip updated' : 'Chip added');
          if(currentView === 'orchestrate') go('orchestrate');
        };
        var del = box.querySelector('#chipDel');
        if(del) del.onclick = function(){
          state.orchestrate.chips = state.orchestrate.chips.filter(function(c){ return c.id !== existing.id; });
          saveState(); closeModal(); toast('Chip removed');
          if(currentView === 'orchestrate') go('orchestrate');
        };
      }
    });
  }

  /* ============ PLAN ============ */
  function renderPlan(root){
    var income = monthlyIncome();
    var hasIncome = (state.income||[]).length > 0;
    var committed = committedThisMonth();
    var savings = goalMonthlyTotal();
    var spent = spentThisMonth();
    var safe = safeToSpend();
    var budgets = state.budgets || {};
    var totalBudget = Object.keys(budgets).reduce(function(s,k){ return s + (Number(budgets[k])||0); }, 0);

    var html = '';
    html += '<div class="section"><div class="section-head">';
    html += '<div><h2>Monthly plan · ' + MO.monthLabel(thisMonth()) + '</h2><div class="sub">Where your money is supposed to go</div></div>';
    html += '<button class="btn btn-lime btn-sm" data-action="edit-budget"><i class="fas fa-pen"></i> Edit</button></div>';
    html += '<div class="grid g3">';
    if(hasIncome){
      html += statCard({ label:'Income', value: MO.fmtFull(income), sub:(state.income||[]).length + ' source' + ((state.income||[]).length!==1?'s':'') });
    } else {
      html += '<div class="card"><div class="stat-label">Income</div>' + emptyLite({
        icon:'arrow-down', title:'No income added',
        body:'Add your salary first.',
        action:'add-income', actionLabel:'Add income'
      }) + '</div>';
    }
    html += statCard({ label:'Committed + planned', value: MO.fmtFull(committed + savings + spent), sub:'Locked or spent' });
    html += statCard({ label:'Safe to spend', value: MO.fmtFull(safe), sub: hasIncome ? 'Available after plan' : 'Add income to unlock' });
    html += '</div></div>';

    if(hasIncome){
      html += '<div class="section"><div class="card">';
      html += '<div class="section-head" style="margin-bottom:1rem"><div><h2 style="font-size:1rem">Salary allocation</h2></div></div>';
      html += '<div style="display:flex;height:16px;border-radius:100px;overflow:hidden;margin-bottom:1rem;background:var(--line-2)">';
      html += allocBar(committed, income, '#111');
      html += allocBar(savings, income, '#7C3AED');
      html += allocBar(spent, income, '#F59E0B');
      html += allocBar(safe, income, '#B8F34A');
      html += '</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:.85rem;font-size:.82rem">';
      html += allocLegend('Commitments', committed, income, '#111');
      html += allocLegend('Savings', savings, income, '#7C3AED');
      html += allocLegend('Spent', spent, income, '#F59E0B');
      html += allocLegend('Flexible', safe, income, '#B8F34A');
      html += '</div></div></div>';
    }

    html += '<div class="section"><div class="section-head"><div><h2>Category budgets</h2><div class="sub">' + (totalBudget > 0 ? MO.fmtFull(totalBudget) + ' planned' : 'Set how much you plan to spend per category') + '</div></div></div>';
    html += '<div class="grid g2">';
    html += Object.keys(budgets).map(function(cat){
      var budget = budgets[cat];
      var spentC = spentByCategory()[cat] || 0;
      if(!budget){
        return '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem">' +
          '<div style="display:flex;align-items:center;gap:.65rem">' +
          '<div class="list-icon" style="background:' + MO.catColor(cat) + '22;color:' + MO.catColor(cat) + ';width:36px;height:36px"><i class="fas fa-' + MO.catIcon(cat) + '"></i></div>' +
          '<div><div style="font-weight:700;font-size:.9rem">' + MO.escapeHTML(cat) + '</div>' +
          '<div class="stat-sub" style="margin-top:.1rem">No budget set</div></div></div></div>' +
          '<button class="btn btn-outline btn-sm btn-block" data-action="edit-budget">Set budget</button></div>';
      }
      var pct = Math.min(100, (spentC/budget)*100);
      var tone = pct >= 100 ? 'red' : pct >= 80 ? 'amber' : 'green';
      return '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem">' +
        '<div style="display:flex;align-items:center;gap:.65rem">' +
        '<div class="list-icon" style="background:' + MO.catColor(cat) + '22;color:' + MO.catColor(cat) + ';width:36px;height:36px"><i class="fas fa-' + MO.catIcon(cat) + '"></i></div>' +
        '<div><div style="font-weight:700;font-size:.9rem">' + MO.escapeHTML(cat) + '</div>' +
        '<div class="stat-sub" style="margin-top:.1rem">' + MO.fmtFull(spentC) + ' of ' + MO.fmtFull(budget) + '</div></div></div>' +
        '<span class="chip chip-' + (tone==='green'?'lime':tone) + '">' + Math.round(pct) + '%</span></div>' +
        progressBar(pct, tone) + '</div>';
    }).join('');
    html += '</div></div>';
    root.innerHTML = html;
  }
  function allocBar(value, total, color){
    var pct = total ? (value/total)*100 : 0;
    if(pct <= 0) return '';
    return '<div style="width:' + pct + '%;background:' + color + ';height:100%"></div>';
  }
  function allocLegend(label, value, total, color){
    var pct = total ? (value/total)*100 : 0;
    return '<div style="display:flex;align-items:center;gap:.5rem">' +
      '<span style="width:10px;height:10px;border-radius:3px;background:' + color + '"></span>' +
      '<span style="color:var(--ink-2);font-weight:500">' + MO.escapeHTML(label) + '</span>' +
      '<span style="color:var(--muted);font-size:.78rem">' + MO.fmtFull(value) + ' · ' + Math.round(pct) + '%</span></div>';
  }

  /* ============ ACTIVITY ============ */
  function renderActivity(root){
    var list = Array.isArray(state.transactions) ? state.transactions.slice() : [];
    var tx = list.sort(function(a,b){
      var da = String(a.date||''), db = String(b.date||'');
      return db.localeCompare(da) || ((b.createdAt||0) - (a.createdAt||0));
    });
    var filter = root.dataset.filter || 'all';
    var m = thisMonth();
    var filtered = tx.filter(function(t){
      if(filter === 'month') return MO.monthKey(t.date) === m;
      if(filter === 'income') return t.type === 'income';
      if(filter === 'expense') return t.type === 'expense';
      return true;
    });
    var totalIn = filtered.filter(function(t){ return t.type==='income'; }).reduce(function(s,t){ return s + (Number(t.amount)||0); }, 0);
    var totalOut = filtered.filter(function(t){ return t.type==='expense'; }).reduce(function(s,t){ return s + (Number(t.amount)||0); }, 0);

    var html = '';
    html += '<div class="section"><div class="section-head">';
    html += '<div><h2>Transactions</h2><div class="sub">' + (filtered.length ? filtered.length + ' entries' : 'Nothing logged yet') + '</div></div>';
    html += '<div style="display:flex;gap:.5rem;flex-wrap:wrap">';
    html += '<button class="btn btn-ghost btn-sm" data-action="import-tx"><i class="fas fa-file-import"></i> Import</button>';
    html += '<button class="btn btn-primary btn-sm" data-action="add-expense"><i class="fas fa-plus"></i> Add</button>';
    html += '</div></div>';

    if(!tx.length){
      html += '<div class="card">' + emptyFull({
        icon:'receipt', title:'No transactions yet',
        body:'Log your first expense or income to start tracking where money goes.',
        action:'add-expense', actionLabel:'Add your first transaction'
      }) + '</div></div>';
      root.innerHTML = html;
      return;
    }

    html += '<div class="seg" style="max-width:100%;margin-bottom:1rem;overflow-x:auto" id="txFilter">';
    html += '<button data-filter="all" class="' + (filter==='all'?'active':'') + '">All</button>';
    html += '<button data-filter="month" class="' + (filter==='month'?'active':'') + '">This month</button>';
    html += '<button data-filter="income" class="' + (filter==='income'?'active':'') + '">Income</button>';
    html += '<button data-filter="expense" class="' + (filter==='expense'?'active':'') + '">Expense</button>';
    html += '</div>';
    html += '<div class="grid g3" style="margin-bottom:1.25rem">';
    html += statCard({ label:'Money in', value: MO.fmtFull(totalIn), sub: filtered.filter(function(t){return t.type==='income';}).length + ' entries' });
    html += statCard({ label:'Money out', value: MO.fmtFull(totalOut), sub: filtered.filter(function(t){return t.type==='expense';}).length + ' entries' });
    html += statCard({ label:'Net', value: MO.fmtFull(totalIn - totalOut), sub:'In minus out' });
    html += '</div>';
    html += '<div class="card" style="padding:.5rem 1.15rem">';
    if(filtered.length){
      html += filtered.map(function(t){
        var isInc = t.type === 'income';
        return listRow({
          icon: isInc ? 'arrow-down' : MO.catIcon(t.category),
          iconBg: isInc ? '#E8F5E9' : MO.catColor(t.category) + '22',
          iconColor: isInc ? 'var(--green)' : MO.catColor(t.category),
          title: t.merchant || t.category,
          sub: MO.fmtDate(t.date) + ' · ' + MO.escapeHTML(t.category) + (t.note ? ' · ' + MO.escapeHTML(t.note) : ''),
          amount: (isInc?'+':'−') + MO.fmtFull(t.amount),
          amountClass: isInc ? 'pos' : '',
          actions: '<button class="icon-btn" data-action="edit-tx" data-id="' + t.id + '"><i class="fas fa-pen"></i></button><button class="icon-btn" data-action="del-tx" data-id="' + t.id + '"><i class="fas fa-trash"></i></button>'
        });
      }).join('');
    } else {
      html += emptyFull({ icon:'filter', title:'No matches', body:'Try a different filter.' });
    }
    html += '</div></div>';
    root.innerHTML = html;
  }

  /* ============ COMMITMENTS ============ */
  function renderCommitments(root){
    var list = state.commitments || [];
    var monthlyTotal = list.filter(function(c){ return c.frequency==='monthly'; }).reduce(function(s,c){ return s + (Number(c.amount)||0); }, 0);
    var annual = monthlyTotal * 12;
    var html = '';
    html += '<div class="section"><div class="section-head">';
    html += '<div><h2>Commitments</h2><div class="sub">Recurring payments and upcoming bills</div></div>';
    html += '<button class="btn btn-primary btn-sm" data-action="add-commitment"><i class="fas fa-plus"></i> Add</button>';
    html += '</div>';
    if(!list.length){
      html += '<div class="card">' + emptyFull({
        icon:'file-invoice', title:'No commitments yet',
        body:'Add rent, EMIs, subscriptions, insurance, or anything else that recurs monthly. We\'ll forecast your cash flow.',
        action:'add-commitment', actionLabel:'Add your first commitment'
      }) + '</div></div>';
      root.innerHTML = html; return;
    }
    html += '<div class="grid g3">';
    html += statCard({ label:'Monthly total', value: MO.fmtFull(monthlyTotal), sub: list.length + ' active' });
    html += statCard({ label:'Annual equivalent', value: MO.fmtFull(annual), sub:'At current amounts' });
    html += statCard({ label:'Essential', value: MO.fmtFull(list.filter(function(c){return c.essential;}).reduce(function(s,c){ return s + (Number(c.amount)||0); },0)), sub: list.filter(function(c){return c.essential;}).length + ' must-pay' });
    html += '</div></div>';
    html += '<div class="section"><div class="card" style="padding:.5rem 1.15rem">';
    html += '<div class="section-head" style="margin-bottom:.5rem"><div><h2 style="font-size:1rem">All commitments</h2><div class="sub">Tap to edit</div></div></div>';
    html += list.slice().sort(function(a,b){ return (a.dueDay||0)-(b.dueDay||0); }).map(function(c){
      var paid = (c.paidMonths||[]).indexOf(thisMonth()) >= 0;
      return listRow({
        icon: MO.catIcon(c.category),
        iconBg: MO.catColor(c.category)+'22',
        iconColor: MO.catColor(c.category),
        title: c.name,
        sub: 'Due day ' + c.dueDay + ' · ' + MO.escapeHTML(c.category) + (c.autopay?' · Auto-pay':'') + (c.essential?' · Essential':''),
        amount: MO.fmtFull(c.amount),
        right: paid ? '<span class="chip chip-green">Paid</span>' : '',
        actions: '<button class="icon-btn" data-action="mark-paid" data-id="' + c.id + '"><i class="fas fa-' + (paid?'rotate-left':'check') + '"></i></button><button class="icon-btn" data-action="edit-commitment" data-id="' + c.id + '"><i class="fas fa-pen"></i></button><button class="icon-btn" data-action="del-commitment" data-id="' + c.id + '"><i class="fas fa-trash"></i></button>'
      });
    }).join('');
    html += '</div></div>';
    root.innerHTML = html;
  }

  /* ============ GOALS ============ */
  function renderGoals(root){
    var goals = state.goals || [];
    var totalSaved = totalGoalsSaved();
    var totalTarget = goals.reduce(function(s,g){ return s + (Number(g.target)||0); }, 0);
    var monthly = goalMonthlyTotal();
    var html = '';
    html += '<div class="section"><div class="section-head">';
    html += '<div><h2>Goals</h2><div class="sub">Future purchases and safety nets</div></div>';
    html += '<button class="btn btn-primary btn-sm" data-action="add-goal"><i class="fas fa-plus"></i> New</button>';
    html += '</div>';
    if(!goals.length){
      html += '<div class="card">' + emptyFull({
        icon:'bullseye', title:'No goals yet',
        body:'Start with an emergency fund, then add future purchases or trips. We\'ll track progress.',
        action:'add-goal', actionLabel:'Create your first goal'
      }) + '</div></div>';
      root.innerHTML = html; return;
    }
    html += '<div class="grid g3">';
    html += statCard({ label:'Total saved', value: MO.fmtFull(totalSaved), sub:'of ' + MO.fmtFull(totalTarget) });
    html += statCard({ label:'Monthly allocation', value: MO.fmtFull(monthly), sub:'Across all goals' });
    html += statCard({ label:'Progress', value: (totalTarget?Math.round((totalSaved/totalTarget)*100):0) + '%', sub:'Overall' });
    html += '</div></div>';
    html += '<div class="section"><div class="grid g2">';
    html += goals.map(function(g){
      var pct = g.target ? Math.min(100, (g.saved/g.target)*100) : 0;
      var monthsLeft = g.monthly ? Math.ceil((g.target - g.saved) / g.monthly) : 0;
      var eta = monthsLeft > 0 ? monthsLeft + ' month' + (monthsLeft!==1?'s':'') + ' to go' : 'Completed 🎉';
      return '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem">' +
        '<div style="display:flex;gap:.75rem;align-items:center">' +
        '<div class="list-icon" style="background:' + g.color + '22;color:' + g.color + ';width:44px;height:44px;font-size:1.1rem"><i class="fas fa-' + (g.icon||'bullseye') + '"></i></div>' +
        '<div><div style="font-weight:700;font-size:1rem">' + MO.escapeHTML(g.name) + '</div>' +
        '<div class="stat-sub" style="margin-top:.1rem">' + eta + '</div></div></div>' +
        '<button class="icon-btn" data-action="edit-goal" data-id="' + g.id + '"><i class="fas fa-pen"></i></button></div>' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.25rem">' +
        '<div><span style="font-size:1.5rem;font-weight:800">' + MO.fmtFull(g.saved) + '</span> <span style="color:var(--muted);font-size:.85rem">/ ' + MO.fmtFull(g.target) + '</span></div>' +
        '<span style="font-weight:700;color:' + g.color + '">' + Math.round(pct) + '%</span></div>' +
        progressBar(pct, 'green') +
        '<div style="display:flex;justify-content:space-between;margin-top:.75rem;align-items:center">' +
        '<span class="stat-sub">' + MO.fmtFull(g.monthly) + '/month</span>' +
        '<button class="btn btn-ghost btn-sm" data-action="contribute" data-id="' + g.id + '"><i class="fas fa-plus"></i> Contribute</button></div></div>';
    }).join('');
    html += '</div></div>';
    root.innerHTML = html;
  }

  /* ============ POSITION ============ */
  function renderPosition(root){
    var assets = (state.accounts||[]).reduce(function(s,a){ return s + Math.max(0, Number(a.balance)||0); }, 0) + totalGoalsSaved();
    var liab = totalLiabilities();
    var net = assets - liab;
    var html = '';
    html += '<div class="section"><div class="section-head">';
    html += '<div><h2>Financial position</h2><div class="sub">What you own minus what you owe</div></div>';
    html += '<button class="btn btn-primary btn-sm" data-action="add-liability"><i class="fas fa-plus"></i> Add</button>';
    html += '</div>';
    html += '<div class="card card-lg" style="background:linear-gradient(135deg,#111 0%,#222 100%);color:#fff;border:none">';
    html += '<div class="stat-label" style="color:#aaa">Net position</div>';
    html += '<div class="stat-value lg" style="color:#fff">' + MO.fmtFull(net) + '</div>';
    html += '<div style="display:flex;gap:2rem;margin-top:1rem;flex-wrap:wrap">';
    html += '<div><div style="font-size:.72rem;text-transform:uppercase;color:#aaa;font-weight:700">Assets</div><div style="font-size:1.15rem;font-weight:700">' + MO.fmtFull(assets) + '</div></div>';

  /* ============ INSIGHTS ============ */
  function renderInsights(root){
    var txCount = (state.transactions||[]).length;
    var m = thisMonth();
    var months = [MO.addMonths(m,-3), MO.addMonths(m,-2), MO.addMonths(m,-1), m];
    var spendSeries = months.map(function(mo){
      return { month: mo, total: (state.transactions||[]).filter(function(t){ return t.type==='expense' && MO.monthKey(t.date)===mo; }).reduce(function(s,t){ return s+(Number(t.amount)||0); }, 0) };
    });
    var max = Math.max.apply(null, spendSeries.map(function(s){ return s.total; }).concat([1]));
    var catSpend = spentByCategory();
    var topCats = Object.keys(catSpend).map(function(k){ return [k, catSpend[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var income = monthlyIncome();
    var savings = goalMonthlyTotal();
    var savingsRate = income ? Math.round((savings/income)*100) : 0;
    var html = '';
    html += '<div class="section"><div class="section-head"><div><h2>Insights</h2><div class="sub">Patterns and changes</div></div></div>';
    if(!txCount && !(state.income||[]).length){
      html += '<div class="card">' + emptyFull({
        icon:'chart-line', title:'Insights unlock as you use Money OS',
        body:'Once you have a few transactions and some income, we\'ll show you trends and category breakdowns.',
        action:'add-expense', actionLabel:'Add a transaction'
      }) + '</div></div>';
      root.innerHTML = html; return;
    }
    html += '<div class="grid g4">';
    html += statCard({ label:'Savings rate', value: savingsRate + '%', sub:'Of monthly income' });
    html += statCard({ label:'Avg monthly spend', value: MO.fmtFull(spendSeries.reduce(function(s,x){ return s+x.total; },0)/4), sub:'Last 4 months' });
    html += statCard({ label:'Top category', value: topCats[0] ? MO.escapeHTML(topCats[0][0]) : '—', sub: topCats[0] ? MO.fmtFull(topCats[0][1]) : 'No spend yet' });
    html += statCard({ label:'Transactions', value: txCount, sub:'All time' });
    html += '</div></div>';
    if(txCount){
      html += '<div class="section"><div class="card">';
      html += '<div class="section-head" style="margin-bottom:.5rem"><div><h2 style="font-size:1rem">Spending trend</h2></div></div>';
      html += '<div class="bars">';
      html += spendSeries.map(function(s){
        var h = (s.total/max)*100;
        return '<div class="bar-col"><div class="bar-value">' + MO.fmtFull(s.total) + '</div>' +
          '<div class="bar ' + (s.month===m?'ink':'') + '" style="height:' + h + '%"></div>' +
          '<div class="bar-label">' + MO.parseDate(s.month+'-01').toLocaleDateString('en-IN',{month:'short'}) + '</div></div>';
      }).join('');
      html += '</div></div></div>';
    }
    root.innerHTML = html;
  }

  function renderScenario(key){
    var income = monthlyIncome();
    var committed = committedThisMonth();
    var savings = goalMonthlyTotal();
    var scenarios = {
      moveout: { title:'Move out', changes: [
        {label:'Rent', from:0, to:22000},{label:'Utilities', from:0, to:3000},
        {label:'Food', from:6500, to:10000},{label:'Transport', from:4500, to:5500}
      ]},
      car: { title:'Buy a car', changes: [
        {label:'Car EMI', from:0, to:12500},{label:'Fuel', from:0, to:3000},{label:'Insurance', from:0, to:1200}
      ]},
      raise: { title:'Salary increase', changes: [
        {label:'Income', from:income, to:income + 15000, isIncome:true},{label:'Tax impact', from:0, to:2500}
      ]},
      loan: { title:'Take a loan', changes: [
        {label:'New EMI', from:0, to:8500},{label:'Processing fee', from:0, to:5000, oneTime:true}
      ]}
    };
    var s = scenarios[key];
    if(!s) return '<div class="empty">Unknown scenario</div>';
    var newCommitted = committed, newIncome = income, oneTime = 0;
    s.changes.forEach(function(c){
      if(c.isIncome) newIncome = c.to;
      else if(c.oneTime) oneTime += c.to;
      else newCommitted += (c.to - c.from);
    });
    var oldSafe = income - committed - savings;
    var newSafe = newIncome - newCommitted - savings;
    var delta = newSafe - oldSafe;
    var html = '';
    html += '<div class="stat-label">Scenario</div>';
    html += '<div style="font-size:1.3rem;font-weight:800;margin-bottom:1rem">' + MO.escapeHTML(s.title) + '</div>';
    html += '<div style="display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.25rem">';
    html += s.changes.map(function(c){
      return '<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:.4rem 0;border-bottom:1px solid var(--line-2)">' +
        '<span style="color:var(--ink-2)">' + MO.escapeHTML(c.label) + '</span>' +
        '<span style="font-weight:700;color:' + (c.isIncome?'var(--green)':'var(--ink)') + '">' + (c.from!==0?MO.fmtFull(c.from)+' → ':'') + MO.fmtFull(c.to) + '</span></div>';
    }).join('');
    html += '</div>';
    html += '<div class="grid g2" style="gap:.75rem">';
    html += '<div class="card" style="padding:1rem;background:var(--line-2);border:none"><div class="stat-label">Safe now</div><div style="font-size:1.25rem;font-weight:800">' + MO.fmtFull(oldSafe) + '</div></div>';
    html += '<div class="card" style="padding:1rem;background:var(--ink);color:#fff;border:none"><div class="stat-label" style="color:#aaa">After change</div><div style="font-size:1.25rem;font-weight:800;color:' + (delta>=0?'var(--lime)':'#FF8A7A') + '">' + MO.fmtFull(newSafe) + '</div></div>';
    html += '</div>';
    html += '<div style="margin-top:1rem;font-size:.85rem;font-weight:600;color:' + (delta>=0?'var(--green)':'var(--red)') + '">' +
      '<i class="fas fa-' + (delta>=0?'arrow-up':'arrow-down') + '"></i> ' + (delta>=0?'+':'') + MO.fmtFull(delta) + ' monthly impact</div>';
    return html;
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  document.addEventListener('click', function(e){
    var nav = e.target.closest('.nav-item[data-view]');
    if(nav){ go(nav.dataset.view); return; }

    var bn = e.target.closest('.bottom-nav-item');
    if(bn){
      var view = bn.dataset.view;
      if(view === 'more'){ openMoreSheet(); }
      else go(view);
      return;
    }

    var msi = e.target.closest('.more-sheet-item');
    if(msi){
      closeMoreSheet();
      go(msi.dataset.view);
      return;
    }

    var seg = e.target.closest('#txFilter button');
    if(seg){
      var viewEl = document.getElementById('view-activity');
      if(viewEl){ viewEl.dataset.filter = seg.dataset.filter; renderActivity(viewEl); }
      return;
    }

    var rm = e.target.closest('[data-remove]');
    if(rm){
      e.stopPropagation();
      var rid = rm.dataset.remove;
      state.orchestrate.chips = (state.orchestrate.chips||[]).filter(function(c){ return c.id !== rid; });
      saveState();
      toast('Chip removed');
      go('orchestrate');
      return;
    }

    var action = e.target.closest('[data-action]');
    if(!action) return;
    var a = action.dataset.action;

    if(a === 'add-expense') return openTxModal('expense');
    if(a === 'add-income') return openIncomeModal();
    if(a === 'edit-tx'){
      var t = state.transactions.find(function(x){ return x.id === action.dataset.id; });
      if(t) openTxModal(t.type, t);
      return;
    }
    if(a === 'del-tx'){
      confirmDelete('transaction', function(){
        state.transactions = state.transactions.filter(function(x){ return x.id !== action.dataset.id; });
        saveState(); toast('Transaction deleted'); go(currentView);
      });
      return;
    }
    if(a === 'add-commitment') return openCommitmentModal();
    if(a === 'edit-commitment'){
      var c = state.commitments.find(function(x){ return x.id === action.dataset.id; });
      if(c) openCommitmentModal(c);
      return;
    }
    if(a === 'del-commitment'){
      confirmDelete('commitment', function(){
        state.commitments = state.commitments.filter(function(x){ return x.id !== action.dataset.id; });
        saveState(); toast('Commitment deleted'); go(currentView);
      });
      return;
    }
    if(a === 'mark-paid'){
      var cc = state.commitments.find(function(x){ return x.id === action.dataset.id; });
      if(!cc) return;
      cc.paidMonths = Array.isArray(cc.paidMonths) ? cc.paidMonths : [];
      var m = thisMonth();
      if(cc.paidMonths.indexOf(m) >= 0) cc.paidMonths = cc.paidMonths.filter(function(x){ return x !== m; });
      else cc.paidMonths.push(m);
      saveState(); toast(cc.paidMonths.indexOf(m) >= 0 ? 'Marked paid' : 'Marked unpaid'); go(currentView);
      return;
    }
    if(a === 'add-goal') return openGoalModal();
    if(a === 'edit-goal'){
      var g = state.goals.find(function(x){ return x.id === action.dataset.id; });
      if(g) openGoalModal(g);
      return;
    }
    if(a === 'contribute') return openContributeModal(action.dataset.id);
    if(a === 'add-liability') return openLiabilityModal();
    if(a === 'edit-liability'){
      var l = state.liabilities.find(function(x){ return x.id === action.dataset.id; });
      if(l) openLiabilityModal(l);
      return;
    }
    if(a === 'del-liability'){
      confirmDelete('liability', function(){
        state.liabilities = state.liabilities.filter(function(x){ return x.id !== action.dataset.id; });
        saveState(); toast('Liability deleted'); go(currentView);
      });
      return;
    }
    if(a === 'edit-budget') return openBudgetModal();
    if(a === 'edit-accounts') return openAccountsModal();
    if(a === 'import-tx') return openImportModal();
    if(a === 'go-commitments') return go('commitments');
    if(a === 'go-insights') return go('insights');
    if(a === 'dismiss-checklist'){ state.checklistDismissed = true; saveState(); go('home'); return; }
    if(a === 'replay-tour'){ startTour(); return; }
    if(a === 'show-checklist'){ state.checklistDismissed = false; saveState(); toast('Checklist restored'); go('home'); return; }
    if(a === 'orch-add'){
      var sname = action.dataset.name;
      var s = ORCH_SUGGESTIONS.find(function(x){ return x.name === sname; });
      if(!s) return;
      if(!Array.isArray(state.orchestrate.chips)) state.orchestrate.chips = [];
      state.orchestrate.chips.push({ id: MO.uid(), name: s.name, amount: s.amount, emoji: s.emoji, color: s.color, calc: { mode:'monthly', amount: s.amount } });
      saveState(); toast(s.emoji + ' ' + s.name + ' added'); go('orchestrate');
      return;
    }
    if(a === 'orch-custom') return openChipModal();
    if(a === 'orch-edit'){
      var chip = (state.orchestrate.chips||[]).find(function(x){ return x.id === action.dataset.id; });
      if(chip) openChipModal(chip);
      return;
    }
    if(a === 'orch-reset' || a === 'orch-clear'){
      confirmDelete('all chips', function(){
        state.orchestrate.chips = [];
        saveState(); toast('Plan cleared'); go('orchestrate');
      });
      return;
    }
    if(a === 'scenario'){
      var k = action.dataset.scenario;
      var out = document.getElementById('scenarioOutput');
      if(out) out.innerHTML = renderScenario(k);
      return;
    }
    if(a === 'export-data'){
      try {
        var data = JSON.stringify(state, null, 2);
        var blob = new Blob([data], { type:'application/json' });
        var url = URL.createObjectURL(blob);
        var el = document.createElement('a');
        var stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
        el.href = url; el.download = 'moneyos-backup-' + stamp + '.json';
        document.body.appendChild(el); el.click(); document.body.removeChild(el);
        URL.revokeObjectURL(url);
        toast('Backup downloaded');
      } catch(err){ toast('Export failed', 'fa-triangle-exclamation'); }
      return;
    }
    if(a === 'import-data'){
      var inp = document.getElementById('fileImport');
      inp.value = '';
      inp.onchange = function(){
        var file = inp.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          try {
            var parsed = JSON.parse(ev.target.result);
            if(!parsed || typeof parsed !== 'object') throw new Error('Invalid');
            state = MO.migrate(parsed);
            saveState();
            document.getElementById('userNameEl').textContent = state.user.name;
            document.getElementById('userAvatarEl').textContent = (state.user.name||'U').charAt(0).toUpperCase();
            toast('Backup restored');
            go('home');
          } catch(err){ toast('Could not read file', 'fa-triangle-exclamation'); }
        };
        reader.readAsText(file);
      };
      inp.click();
      return;
    }
    if(a === 'save-name'){
      var n = document.getElementById('prefName').value.trim();
      if(!n){ toast('Name cannot be empty', 'fa-triangle-exclamation'); return; }
      state.user.name = n;
      saveState();
      document.getElementById('userNameEl').textContent = n;
      document.getElementById('userAvatarEl').textContent = n.charAt(0).toUpperCase();
      toast('Name saved');
      return;
    }

  /* ---- Modal: Import ---- */
  function openImportModal(){
    openModal({
      title: 'Import transactions',
      sub: 'Paste text, one per line',
      body: '<div class="form-group"><label class="form-label">Paste transaction text</label>' +
        '<textarea class="form-textarea" id="importText" placeholder="Swiggy 420&#10;Zomato 580&#10;Uber 280"></textarea>' +
        '<div class="form-hint">Format: <strong>merchant amount</strong>. Category is auto-guessed.</div></div>' +
        '<div class="form-group"><label class="form-label">Default date</label>' +
        '<input class="form-input" type="date" id="importDate" value="' + MO.todayISO() + '"></div>',
      footer: '<button class="btn btn-ghost btn-block" data-close>Cancel</button><button class="btn btn-lime btn-block" id="importGo">Import</button>',
      onMount: function(box){
        box.querySelector('#importGo').onclick = function(){
          var raw = box.querySelector('#importText').value.trim();
          var date = box.querySelector('#importDate').value || MO.todayISO();
          if(!raw){ toast('Nothing to import', 'fa-triangle-exclamation'); return; }
          var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
          var count = 0;
          lines.forEach(function(line){
            var m = line.match(/^(.+?)\s+([\d,]+(?:\.\d+)?)$/);
            if(!m) return;
            var merchant = m[1].trim();
            var amount = Number(m[2].replace(/,/g,''));
            if(!amount) return;
            state.transactions.push({
              id: MO.uid(), merchant: merchant, amount: amount,
              category: guessCategory(merchant), note: '', date: date,
              accountId: state.accounts[0] ? state.accounts[0].id : 'acc_bank',
              type: 'expense', createdAt: Date.now()
            });
            count++;
          });
          saveState(); closeModal();
          if(count) toast('Imported ' + count + ' transaction' + (count!==1?'s':''));
          else toast('Could not parse', 'fa-triangle-exclamation');
          go('activity');
        };
      }
    });
  }
  function guessCategory(merchant){
    var m = merchant.toLowerCase();
    if(/swiggy|zomato|restaurant|food/.test(m)) return 'Food';
    if(/uber|ola|petrol/.test(m)) return 'Transport';
    if(/amazon|flipkart|myntra/.test(m)) return 'Shopping';
    if(/netflix|spotify|prime/.test(m)) return 'Subscriptions';
    if(/electric|water|gas|internet/.test(m)) return 'Bills';
    if(/rent|house/.test(m)) return 'Household';
    return 'Other';
  }

     BOTTOM NAV (mobile)
     ============================================================ */
  function buildBottomNav(){
    var inner = document.getElementById('bottomNavInner');
    if(!inner) return;
    var html = '';
    BOTTOM_NAV_PRIMARY.forEach(function(it){
      html += '<button class="bottom-nav-item" data-view="' + it.id + '" aria-label="' + it.label + '">' +
        '<i class="fas fa-' + it.icon + '"></i><span>' + it.label + '</span></button>';
    });
    // "More" button
    html += '<button class="bottom-nav-item" data-view="more" aria-label="More">' +
      '<i class="fas fa-ellipsis"></i><span>More</span></button>';
    inner.innerHTML = html;
    updateBottomNavActive();
  }
  function updateBottomNavActive(){
    var isPrimary = BOTTOM_NAV_PRIMARY.some(function(it){ return it.id === currentView; });
    var items = document.querySelectorAll('.bottom-nav-item');
    Array.prototype.forEach.call(items, function(el){
      var v = el.dataset.view;
      if(v === 'more') el.classList.toggle('active', !isPrimary);
      else el.classList.toggle('active', v === currentView);
    });
  }

  /* ============================================================
     NAV (desktop sidebar)
     ============================================================ */
  function buildNav(){
    var nav = document.getElementById('navSection');
    if(!nav) return;
    var items = [
      { section:'Overview', items:[
        { id:'home', label:'Home', icon:'house' },
        { id:'orchestrate', label:'Orchestrate', icon:'diagram-project' },
        { id:'plan', label:'Plan', icon:'compass-drafting' },
        { id:'activity', label:'Activity', icon:'list-ul' },
        { id:'commitments', label:'Commitments', icon:'file-invoice' }
      ]},
      { section:'Wealth', items:[
        { id:'goals', label:'Goals', icon:'bullseye' },
        { id:'position', label:'Position', icon:'scale-balanced' }
      ]},
      { section:'Intelligence', items:[
        { id:'insights', label:'Insights', icon:'chart-line' },
        { id:'whatif', label:'What if?', icon:'flask' }
      ]},
      { section:'System', items:[
        { id:'settings', label:'Settings', icon:'gear' }
      ]}
    ];
    var html = '';
    items.forEach(function(group){
      html += '<div class="nav-label">' + group.section + '</div>';
      group.items.forEach(function(it){
        html += '<button class="nav-item' + (it.id === currentView ? ' active' : '') + '" data-view="' + it.id + '">' +
          '<i class="fas fa-' + it.icon + '"></i>' + it.label + '</button>';
      });
    });
    nav.innerHTML = html;
  }

  /* ============================================================
     SAVE INDICATOR
     ============================================================ */
  window.addEventListener('moneyos:saved', function(){
    var el = document.getElementById('saveIndicator');
    var txt = document.getElementById('saveIndicatorText');
    if(!el || !txt) return;
    txt.textContent = 'Saved';
    el.classList.add('pulse');
    setTimeout(function(){ el.classList.remove('pulse'); }, 700);
  });

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    console.log('[Money OS] Boot: starting');
    try {
      state = MO.loadState();
      console.log('[Money OS] Boot: state loaded', {
        income: state.income.length, tx: state.transactions.length,
        commitments: state.commitments.length, chips: state.orchestrate.chips.length,
        onboardingComplete: state.onboardingComplete
      });
      saveState();

      // Sidebar toggle
      var hb = document.getElementById('hamburger');
      if(hb) hb.onclick = function(){
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('backdrop').classList.toggle('active');
      };
      var bd = document.getElementById('backdrop');
      if(bd) bd.onclick = function(){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('backdrop').classList.remove('active');
      };
      var qa = document.getElementById('quickAddBtn');
      if(qa) qa.onclick = function(){ openTxModal('expense'); };

      // User info
      var un = document.getElementById('userNameEl');
      if(un) un.textContent = state.user.name || 'You';
      var ua = document.getElementById('userAvatarEl');
      if(ua) ua.textContent = (state.user.name || 'U').charAt(0).toUpperCase();

      buildNav();
      buildBottomNav();
      go('home');

      var last = MO.ls.get(MO.STORAGE_SAVED_KEY);
      var st = document.getElementById('saveIndicatorText');
      if(st && last) st.textContent = 'Saved';

      console.log('[Money OS] Boot: complete');

      if(!state.onboardingComplete){
        setTimeout(function(){ startTour(); }, 600);
      }
    } catch(err){
      console.error('[Money OS] Boot failed:', err);
      var content = document.getElementById('content');
      if(content){
        content.innerHTML = '<div class="error-banner">' +
          '<div class="error-banner-title"><i class="fas fa-triangle-exclamation"></i> Failed to start</div>' +
          '<div class="error-banner-text">' + MO.escapeHTML(err.message || String(err)) + '</div>' +
          '<div class="error-banner-actions">' +
          '<button class="btn btn-primary btn-sm" onclick="location.reload()">Reload</button>' +
          '<button class="btn btn-danger btn-sm" onclick="try{localStorage.clear()}catch(e){};location.reload()">Reset all data</button>' +
          '</div></div>';
      }
    }
  }

  // Rerender tour on resize so it stays centered
  var resizeTimer;
  window.addEventListener('resize', function(){
    if(!tourState.active) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderTourStep, 200);
  });

  // Handle orientation change
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){
      if(tourState.active) renderTourStep();
      // Close sidebar/more-sheet on orientation change to avoid layout glitches
      var sb = document.getElementById('sidebar'); if(sb) sb.classList.remove('open');
      var bd = document.getElementById('backdrop'); if(bd) bd.classList.remove('active');
      closeMoreSheet();
    }, 250);
  });

  window.addEventListener('beforeunload', function(){ try { saveState(); } catch(e){} });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){ try { saveState(); } catch(e){} }
  });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

console.log('[Money OS] Script 4: main app loaded');
</script>
</body>
</html>
